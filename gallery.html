<style>

body::after {

  z-index: -1;

/* HEADER */
header {

  justify-content: center;

  gap: 24px;

nav a {
  color: white;
  text-decoration: none;

  font-weight: 700;
  position: relative;

}

nav a:hover,

nav a.active::after {
  content: "";

  right: -10px;

/* MAIN */

  width: min(1200px, 92%);
  margin: 0 auto;
  padding-top: 125px;
  padding-bottom: 70px;
}

.page-heading {
  text-align: center;
  margin-bottom: 38px;
}

.page-heading h1 {
  font-family: 'Cinzel', serif;
  font-size: clamp(34px, 5vw, 54px);
  color: #ffcc66;
  font-weight: 900;
  margin-bottom: 12px;
}

.subtext {
  text-align: center;
  color: #d8d8d8;
  max-width: 760px;
  margin: 0 auto;
  font-size: 16px;
  line-height: 1.7;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 24px;
}

.gallery-item {
  overflow: hidden;
  border-radius: 20px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,204,102,0.25);
  min-height: 270px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.42);
  backdrop-filter: blur(10px);
  transition: 0.35s ease;
  position: relative;
}

.gallery-item:hover {
  transform: translateY(-7px);
  background: rgba(255,204,102,0.10);
}

.gallery-item img {
  width: 100%;
  height: 270px;
  object-fit: cover;
  display: block;
  cursor: pointer;
  transition: transform 0.4s ease, opacity 0.4s ease;
  opacity: 0.92;
}

.gallery-item img:hover {
  transform: scale(1.07);
  opacity: 1;
}

.status {
  text-align: center;
  padding: 30px 15px;
  color: #ffcc66;
  font-size: 16px;
}

/* POPUP */
#popup {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.94);
  justify-content: center;
  align-items: center;

#popup .close-btn {

}

/* FOOTER */
footer {

  box-shadow: 0 0 20px rgba(37,211,102,.6);

/* MOBILE */
@media (max-width: 768px) {

    padding: 12px 8px;

  nav {

</style>

<body>

<header>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="sermons.html">Sermons</a>
    <a href="gallery.html" class="active">Gallery</a>
    <a href="prayer.html">Prayer</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="main-content">
  <div class="page-heading">
    <h1>Our Ministry Gallery</h1>
    <p class="subtext">
      A glimpse of ministry moments, prayer gatherings, worship, fellowship,
      and the work of God through TGPM.
    </p>
  </div>

  <div id="gallery" class="gallery"></div>
  <div id="status" class="status">Loading gallery...</div>
</div>

<div id="popup">
  <span class="close-btn" onclick="closeImg()">&times;</span>
  <img id="popupImg" alt="TGPM Gallery Image" />
</div>

<footer>
  <p><strong>The God's Power Ministry</strong></p>
  <p>© 2026 TGPM Ministry | All Rights Reserved</p>
  <p>Jesus is the only God ✝</p>
</footer>

<a href="https://wa.me/917724953676" class="whatsapp-float" target="_blank" aria-label="Chat on WhatsApp">💬</a>

<script>
async function loadGallery() {
  const gallery = document.getElementById("gallery");
  const status = document.getElementById("status");

  try {
    const response = await fetch("./images.json");

    if (!response.ok) {
      throw new Error("images.json not found");
    }

    const images = await response.json();

    if (!Array.isArray(images) || images.length === 0) {
      status.textContent = "No images found in images.json.";
      return;
    }

    gallery.innerHTML = "";
    let validCount = 0;

    images.forEach((fileName) => {
      const item = document.createElement("div");
      item.className = "gallery-item";

      const img = document.createElement("img");
      img.src = "./images/gallery/" + fileName;
      img.alt = "TGPM Ministry Gallery - " + fileName;
      img.loading = "lazy";

      img.addEventListener("click", function () {
        openImg(img.src);
      });

      img.addEventListener("load", function () {
        validCount++;
        status.style.display = "none";
      });

      img.addEventListener("error", function () {
        item.remove();
        if (validCount === 0 && gallery.children.length === 0) {
          status.textContent = "Images could not be loaded. Check image names and folder path.";
        }
      });

      item.appendChild(img);
      gallery.appendChild(item);
    });
  } catch (error) {
    status.textContent = "Unable to load gallery. Please check images.json location and format.";
    console.error(error);
  }
}

function openImg(src) {
  document.getElementById("popup").style.display = "flex";
  document.getElementById("popupImg").src = src;
  document.body.style.overflow = "hidden";
}

function closeImg() {
  document.getElementById("popup").style.display = "none";
  document.getElementById("popupImg").src = "";
  document.body.style.overflow = "auto";
}

document.getElementById("popup").addEventListener("click", function (e) {
  if (e.target.id === "popup") {
    closeImg();
  }
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    closeImg();
  }
});

loadGallery();
</script>

</body>
